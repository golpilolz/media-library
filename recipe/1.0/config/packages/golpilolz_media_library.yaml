golpilolz_media_library:
    # Concrete Doctrine entities extending Golpilolz\MediaLibrary\Model\{File,Folder}
    file:
        file_class: App\Entity\File
    folder:
        folder_class: App\Entity\Folder
    # Public path where the library files are served
    assets_path: /assets/golpilolzmedialibrary
    # Name of the root folder shown in the popup
    root_folder: /library
    include_assets: true
    include_bootstrap: true
    include_jQuery: true
