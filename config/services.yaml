services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Controllers, form type and entity repositories (ServiceEntityRepository).
    Golpilolz\MediaLibrary\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/GolpilolzMediaLibrary.php'

    Golpilolz\MediaLibrary\Form\Type\GolpilolzMediaLibrarySingleType:
        arguments:
            $defaultTheme: '%golpilolz_medialibrary.theme%'
            $csrfProtection: '%golpilolz_medialibrary.security.csrf_protection%'
